<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="snapYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFC00"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="150" y1="0" x2="150" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="450" y1="0" x2="450" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="750" y1="0" x2="750" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
    <line x1="1050" y1="0" x2="1050" y2="800"/>
  </g>

  <!-- Glowing background orbs -->
  <circle cx="200" cy="150" r="180" fill="#FFFC00" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="650" r="220" fill="#0ea5e9" opacity="0.15" filter="url(#glow)"/>

  <!-- Top Bar: Handshake Mission Badge -->
  <g transform="translate(80, 70)">
    <rect width="320" height="42" rx="21" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="9" fill="#10b981"/>
    <text x="44" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" letter-spacing="1">HANDSHAKE AI SHOWCASE</text>
  </g>

  <g transform="translate(820, 70)">
    <rect width="300" height="42" rx="21" fill="#1e293b" stroke="#FFFC00" stroke-width="1.5"/>
    <text x="150" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFC00" letter-spacing="1">AI PROJECT BUILDER BADGE</text>
  </g>

  <!-- Main Headline Title -->
  <text x="80" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">
    90-Second Account Brief
  </text>
  <text x="80" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="url(#snapYellow)">
    Snap Inc. • Account Manager Interview Briefing
  </text>
  <text x="80" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" fill="#94a3b8">
    Powered by Clay AI (Claygent) • 5 Enterprise Accounts: Snap Inc. • Stripe • Datadog • OpenAI • NVIDIA
  </text>

  <!-- Central Visual Showcase Card -->
  <g transform="translate(80, 350)">
    <rect width="1040" height="260" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Left Column: Core 5 Pillars -->
    <g transform="translate(40, 40)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#38bdf8" letter-spacing="1.5">VERIFIED 5-ITEM STRUCTURE</text>
      
      <g transform="translate(0, 30)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">1. Plain Explanation</text>
        <text x="260" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">Disappearing video messages &amp; AR camera</text>
      </g>

      <g transform="translate(0, 65)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">2. Revenue Engine</text>
        <text x="260" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">>85% video/AR ads + 12M+ Snapchat+ subscribers</text>
      </g>

      <g transform="translate(0, 100)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">3. Dated News (12 Mo)</text>
        <text x="260" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">Sept 2024 Spectacles 5 + Feb 2024 DR ad platform</text>
      </g>

      <g transform="translate(0, 135)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">4. Target Customers</text>
        <text x="260" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">Global brands &amp; DTC advertisers reaching Gen Z</text>
      </g>

      <g transform="translate(0, 170)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">5. Strategic Question</text>
        <text x="260" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">Packaging developer AR lenses with performance ads</text>
      </g>
    </g>

    <!-- Right Column: Verification Stats Column -->
    <g transform="translate(740, 35)">
      <rect width="255" height="190" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>

      <text x="25" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1">AUDIT SUMMARY</text>
      
      <text x="25" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#10b981">182 / 200</text>
      <text x="25" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Strict Word Count (Pass)</text>

      <text x="25" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#38bdf8">84.0s</text>
      <text x="25" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Natural Reading Pace (~90s)</text>

      <text x="25" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FACC15">✓ 100% Fact-Checked Against SEC</text>
    </g>
  </g>

  <!-- Bottom Metric Pills -->
  <g transform="translate(80, 650)">
    <g transform="translate(0, 0)">
      <rect width="230" height="50" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="115" y="31" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Direct &amp; Verify Framework</text>
    </g>
    <g transform="translate(250, 0)">
      <rect width="230" height="50" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="115" y="31" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Argon Research Model</text>
    </g>
    <g transform="translate(500, 0)">
      <rect width="250" height="50" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="125" y="31" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Handshake 500-Char Ready</text>
    </g>
    <g transform="translate(770, 0)">
      <rect width="270" height="50" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="135" y="31" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Zero Unverified Hallucinations</text>
    </g>
  </g>
</svg>
